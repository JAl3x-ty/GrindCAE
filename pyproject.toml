[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grindcae-literature-kernel"
version = "3.8.1"
description = "Literature grinding force and fixed-mesh history workbench"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "matplotlib>=3.8,<4", "Pillow>=10,<13", "gmsh>=4.13,<5", "meshio>=5.3,<6", "scikit-fem>=12.0.2,<13", "scipy>=1.11,<2"]

[project.gui-scripts]
grindcae380-desktop = "grindcae380.desktop:main"
grindcae380-workbench = "grindcae.gui.app:main"

[project.scripts]
grindcae-literature-history = "grindcae.literature_history.__main__:main"

[tool.setuptools.package-data]
"grindcae.gui.portable_examples" = ["*.json"]
"grindcae.gui.assets" = ["*.ico"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
